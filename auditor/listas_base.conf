# Listas base de binarios que normalmente tienen SUID o SGID.
#
# Si un binario de estas listas aparece con el bit activo, el auditor lo reporta
# con severidad BAJA (solo inventario). Cualquier otro binario con SUID o SGID se
# reporta como una señal que hay que verificar.
#
# Secciones: [comun] se usa siempre; además se usan las secciones cuyo nombre
# coincide con ID o ID_LIKE de /etc/os-release (por ejemplo kali y debian).
# Una ruta por línea, siempre absoluta. Este archivo NO debe ser escribible por
# otros usuarios: el auditor se niega a usarlo si lo es.

[comun]
suid =
    /usr/bin/passwd
    /usr/bin/sudo
    /usr/bin/su
    /usr/bin/mount
    /usr/bin/umount
    /usr/bin/chsh
    /usr/bin/chfn
    /usr/bin/newgrp
    /usr/bin/gpasswd
    /usr/bin/pkexec
    /usr/bin/fusermount
    /usr/bin/fusermount3
    /usr/bin/ping
    /usr/lib/openssh/ssh-keysign
    /usr/lib/dbus-1.0/dbus-daemon-launch-helper
    /usr/lib/policykit-1/polkit-agent-helper-1
    /usr/lib/polkit-1/polkit-agent-helper-1
sgid =
    /usr/bin/chage
    /usr/bin/expiry
    /usr/bin/ssh-agent
    /usr/bin/crontab
    /usr/bin/wall
    /usr/bin/write
    /usr/bin/write.ul
    /usr/bin/plocate
    /usr/sbin/unix_chkpwd
    /usr/sbin/pam_extrausers_chkpwd

[debian]
suid =
sgid =

[ubuntu]
# utempter tiene SGID (grupo utmp) en Ubuntu; antes aparecía como MEDIA (Entrega 2).
suid =
sgid =
    /usr/lib/x86_64-linux-gnu/utempter/utempter

[kali]
# Binarios con SUID/SGID que trae Kali GNU/Linux Rolling 2026.3, tomados de:
# find / -xdev -type f \( -perm -4000 -o -perm -2000 \) 2>/dev/null
# Xorg.wrap tiene SUID y SGID a la vez (6755), por eso está en las dos listas.
# Verificar su paquete con dpkg -S si hay dudas.
suid =
    /usr/lib/xorg/Xorg.wrap
    /usr/lib/chromium/chrome-sandbox
    /usr/sbin/pppd
    /usr/sbin/mount.nfs
    /usr/sbin/mount.cifs
    /usr/bin/ntfs-3g
    /usr/bin/rsh-redone-rsh
    /usr/bin/rsh-redone-rlogin
    /usr/bin/kismet_cap_hak5_wifi_coconut
    /usr/bin/kismet_cap_linux_bluetooth
    /usr/bin/kismet_cap_linux_wifi
    /usr/bin/kismet_cap_nrf_51822
    /usr/bin/kismet_cap_nrf_52840
    /usr/bin/kismet_cap_nrf_mousejack
    /usr/bin/kismet_cap_nxp_kw41z
    /usr/bin/kismet_cap_rz_killerbee
    /usr/bin/kismet_cap_ti_cc_2531
    /usr/bin/kismet_cap_ti_cc_2540
    /usr/bin/kismet_cap_ubertooth_one
sgid =
    /usr/bin/dotlockfile
    /usr/lib/xorg/Xorg.wrap
